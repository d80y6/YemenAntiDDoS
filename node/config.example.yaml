# xSight Node configuration
# Two modes: xdp (default, BPF/XDP mirror) and flow (sFlow/NetFlow/IPFIX receiver)
# Unknown or misspelled keys are silently ignored, so check spelling carefully.

# ============================================================
# XDP Mode (default) — BPF/XDP packet capture from mirror port
# ============================================================

# mode: xdp                       # 'xdp' (default) | 'flow'
node_id: "my-node-01"             # must be registered on the Controller first (Web UI Nodes page)

interfaces:
  # All interfaces must have identical mode, sample_bytes and upstream_sample_rate.
  # Use separate nodes for different settings. Omitted sample_bytes defaults to 256.
  # ERSPAN outer headers need more capture bytes; sample_bytes: 256 is recommended.
  - name: "eth1"
    mode: "mirror"              # mirror | erspan
    upstream_sample_rate: 1     # 1 = no sampling, 300 = upstream samples 1/300
    sample_bytes: 128           # mirror mode: 128 is enough (range 128-512)

bpf:
  max_entries: 1000000          # ip_stats map size (note: prealloc memory)

controller:
  address: "controller:50051"   # gRPC server address

tls:
  # Mutual TLS to the Controller. Enable only after the Controller is serving
  # TLS and this node holds a certificate issued by the deployment CA.
  # If server_name is empty the host part of controller.address is used.
  # See docs/MTLS.md.
  enabled: false
  ca_file: "/etc/xsight/pki/ca.crt"          # verifies the CONTROLLER certificate
  cert_file: "/etc/xsight/pki/my-node-01.crt" # issued with: xsight-cert issue --node-id my-node-01
  key_file: "/etc/xsight/pki/my-node-01.key"
  server_name: "controller"
  allow_legacy_tls12: false

l7:
  # Application-layer inspection (HTTP flood, Slowloris, TLS ClientHello).
  # Requires sample_bytes >= 512 on every XDP interface so a TLS ClientHello
  # is not truncated. Aggregated on the Node and pushed to the Controller as
  # CriticalEventStream messages; the Console renders the L7 dashboard from
  # the in-memory store (controller/internal/l7store).
  enabled: false
  window_seconds: 1          # aggregation window, default 1
  http_rps: 1000             # HTTP requests/s per destination
  tls_hsps: 500              # ClientHellos/s per destination
  slowloris_conns: 50        # slow-open connections per destination
  max_tracked_destinations: 4096
  max_flows: 8192
  max_open_fragments: 256
  sample_bytes: 512

auth:
  # Must equal the API key entered when this node_id was registered on the Controller
  # (not the Controller's auth.api_key). Generate one with: openssl rand -hex 32
  node_api_key: "CHANGE_ME"

# Performance tuning (optional, xdp mode only)
# parse_workers: 4              # parallel packet parse workers (default = NumCPU/2, range 1-16)
# pprof: false                  # enable pprof debug server on 127.0.0.1:6061


# ============================================================
# Flow Mode — sFlow/NetFlow/IPFIX receiver
# ============================================================
# Uncomment below and comment out the xdp config above to use flow mode.
# Flow listeners and sources are configured via Web UI, not this file.
#
# mode: flow
# node_id: "my-flow-node-01"
#
# controller:
#   address: "controller:50051"
#
# auth:
#   node_api_key: "CHANGE_ME"
