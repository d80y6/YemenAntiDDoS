# xSight Node configuration
# Three modes: xdp (default, BPF/XDP mirror), xdp_inline (inline scrubbing),
# and flow (sFlow/NetFlow/IPFIX receiver)
# Unknown or misspelled keys are silently ignored, so check spelling carefully.
#
# Enterprise feature references:
#   mTLS (tls block)      -> docs/MTLS.md / docs/MTLS.ar.md
#   Layer 7 inspection    -> l7 block below (docs/L7.md)
#   Fast-path / XDrop     -> Controller-side (controller/config.example.yaml action_engine)

# ============================================================
# XDP Mode (default) — BPF/XDP packet capture from mirror port
# ============================================================

# mode: xdp                       # 'xdp' (default) | 'xdp_inline' | 'flow'
node_id: "edg-01"             # must be registered on the Controller first (Web UI Nodes page)

interfaces:
  # All interfaces must have identical mode, sample_bytes and upstream_sample_rate.
  # Use separate nodes for different settings. Omitted sample_bytes defaults to 256.
  # ERSPAN outer headers need more capture bytes; sample_bytes: 256 is recommended.
  - name: "eth1"
    mode: "mirror"              # mirror | erspan
    upstream_sample_rate: 1     # 1 = no sampling, 300 = upstream samples 1/300
    sample_bytes: 128           # mirror mode: 128 is enough (range 128-512)

bpf:
  max_entries: 1000000          # ip_stats map size (note: prealloc memory)
  # path: "/opt/xsight/node/xsight_x86_bpfel.o"  # manual BPF ELF path — parsed but has no effect
                                                 # (the object is embedded in the binary)

controller:
  address: "xsight-controller:50051"   # gRPC server address

tls:
  # Mutual TLS to the Controller. Enable only after the Controller is serving
  # TLS and this node holds a certificate issued by the deployment CA.
  # If server_name is empty the host part of controller.address is used.
  # Rollout order and rotation: docs/MTLS.md (EN) / docs/MTLS.ar.md (AR).
  # Generate material with: xsight-cert init-ca ... && xsight-cert issue ...
  enabled: false
  ca_file: "/etc/xsight/pki/ca.crt"          # verifies the CONTROLLER certificate
  cert_file: "/etc/xsight/pki/my-node-01.crt" # issued with: xsight-cert issue --node-id my-node-01
  key_file: "/etc/xsight/pki/my-node-01.key"
  server_name: "controller"
  allow_legacy_tls12: false

l7:
  # Application-layer inspection (HTTP flood, Slowloris, TLS ClientHello).
  # Requires sample_bytes >= 512 on every XDP interface so a TLS ClientHello
  # is not truncated. Aggregated on the Node and pushed to the Controller as
  # CriticalEventStream messages; the Console renders the L7 dashboard from
  # the in-memory store (controller/internal/l7store).
  enabled: false
  window_seconds: 1          # aggregation window, default 1
  http_rps: 1000             # HTTP requests/s per destination
  tls_hsps: 500              # ClientHellos/s per destination
  slowloris_conns: 50        # slow-open connections per destination
  max_tracked_destinations: 4096   # destinations tracked per window (default 4096)
  max_tracked_flows: 8192          # slow-open connections kept for Slowloris (default 65536)
  max_open_fragments: 256          # reassembly slots (default 20)
  sample_bytes: 512                # per-interface capture window, 128-512 (default 256)

# ============================================================
# v4.0 Inline Scrubbing Engine (optional)
# ============================================================
# Set mode: xdp_inline (or inline.enabled: true with mode: xdp) to turn the node
# into an inline scrubber: packets traverse the node on the wire and the XDP
# program decides PASS / DROP / TX / REDIRECT instead of only mirroring.
# The Controller then pushes active_filter_rules via the gRPC ControlStream.
#
# WARNING: attach the node in-line (bridge or routed path), not on a mirror
# port. Validate with a lab link first: a wrong rule set drops production
# traffic. The default action is XDP_PASS, so an unreachable Controller leaves
# the node forwarding normally.
inline:
  enabled: false                 # master switch (mode: xdp_inline implies true)
  burst_pps: 0                   # per-destination burst threshold -> 2s emergency drop (0 = default 200000)
  syn_cookie: true               # stateless SYN-cookie validation for TCP floods
  dns_protect: true              # UDP/DNS reflection defense (rate limits + outstanding-query checks)
  sample_rate: 0                 # 1-in-N L7 sampling of protected traffic (0 = disabled)
  cleanpipe_egress: ""           # egress ifname for clean-pipe redirect ("" = same-interface XDP_TX)
  cleanpipe_encap: ""            # "" | "gre"; geneve is not supported. GRE uses this iface's IPv4 as outer saddr

# Hardware acceleration / OS tuning (optional).
perf:
  cpu_pins: []                   # e.g. [2, 3]; pins the XDP/AF_XDP hot goroutines to these cores
  xdp_mode: "driver"             # driver (default) | generic | offload (SmartNIC; ringbuf/alerts fall back to driver)

# AF_XDP zero-copy L7 inspection (optional; requires a driver with XSK zero-copy support).
af_xdp:
  enabled: false
  queue: 0                       # NIC RX queue steered into the XSK map
  frames: 4096                   # UMEM frame count (power of two)
  frame_size: 4096
  zero_copy: true                # request XDP_ZEROCOPY; falls back to copy mode when unsupported

auth:
  # Must equal the API key entered when this node_id was registered on the Controller
  # (not the Controller's auth.api_key). Generate one with: openssl rand -hex 32
  node_api_key: "06b4aa408c07a0a3e4aa385f6a5aea2f02b421424349c1c97b88de8af3200c0d"

# Performance tuning (optional, xdp mode only)
# parse_workers: 4              # parallel packet parse workers (default = NumCPU/2, range 1-16)
# pprof: false                  # enable pprof debug server on 127.0.0.1:6061


# ============================================================
# Flow Mode — sFlow/NetFlow/IPFIX receiver
# ============================================================
# Uncomment below and comment out the xdp config above to use flow mode.
# Flow listeners and sources are configured via Web UI, not this file.
#
# mode: flow
# node_id: "my-flow-node-01"
#
# controller:
#   address: "controller:50051"
#
# auth:
#   node_api_key: "CHANGE_ME"
