// xSight gRPC service definition.
// Shared between Node (client) and Controller (server).
//

syntax = "proto3";

package xsight;

option go_package = "github.com/d80y6/YemenDDoS/node/internal/pb";

import "google/protobuf/empty.proto";

// ---------------------------------------------------------------------------
// Service definition — Node is gRPC client, Controller is gRPC server
// ---------------------------------------------------------------------------

service XSightService {
  // Handshake: Node → Controller (unary, first step after connection)
  rpc Handshake(NodeHandshake) returns (HandshakeResponse);

  // Three reporting streams: Node → Controller (client streaming)
  rpc StatsStream(stream StatsReport) returns (google.protobuf.Empty);
  rpc SampleStream(stream SampleBatch) returns (google.protobuf.Empty);
  rpc CriticalEventStream(stream CriticalEvent) returns (google.protobuf.Empty);

  // Control channel: Controller ↔ Node (bidirectional streaming)
  rpc ControlStream(stream ControlMessage) returns (stream ControlMessage);
}

// ---------------------------------------------------------------------------
// Handshake
// ---------------------------------------------------------------------------

message NodeHandshake {
  string node_id = 1;
  string api_key = 2;
  repeated string interfaces = 3;
  string agent_version = 4;
  uint64 delivery_version_applied = 5;  // local snapshot version, 0 = none
  string mode = 6;                      // "xdp" (default) | "flow" | "xdp_inline" — v4.0
}

message HandshakeResponse {
  bool   accepted = 1;
  string reject_reason = 2;
  WatchConfig watch_config = 3;
  uint64 delivery_version_current = 4;
}

// ---------------------------------------------------------------------------
// Channel 1: StatsStream (1s aggregated, detection main path)
// ---------------------------------------------------------------------------

message StatsReport {
  string node_id = 1;
  string interface_name = 2;
  uint32 upstream_sample_rate = 3;
  uint32 local_sample_rate = 4;
  int64  timestamp = 5;                   // unix epoch seconds
  repeated IPStats ip_stats = 6;
  repeated PrefixStatsMsg prefix_stats = 7;
  NodeHealth health = 8;
  SamplingMetrics sampling_metrics = 9;
  uint32 gap_seconds = 10;               // data gap after reconnect
  bool   ip_stats_truncated = 11;
  uint32 total_active_ips = 12;
  GlobalStatsMsg global_stats = 13;
  repeated FlowSample top_flows = 20;    // top-N flows this tick

  // v2.11 Phase 2: outbound (src_ip matched) stats
  repeated IPStats src_ip_stats = 30;
  repeated PrefixStatsMsg src_prefix_stats = 31;
  bool   src_ip_stats_truncated = 32;
  uint32 total_active_src_ips = 33;

  // v4.0: inline scrubbing data-plane health (nil for legacy nodes)
  NodePosture posture = 40;
}

// FlowSample is a single aggregated flow (5-tuple) from one tick.
message FlowSample {
  bytes  src_ip      = 1;  // 4 or 16 bytes
  bytes  dst_ip      = 2;
  uint32 src_port    = 3;
  uint32 dst_port    = 4;
  uint32 protocol    = 5;  // 6=TCP, 17=UDP, 1=ICMP
  uint32 tcp_flags   = 6;  // cumulative OR of all TCP flags
  uint64 packets     = 7;
  uint64 bytes_total = 8;
}

message IPStats {
  bytes  dst_ip = 1;           // 4 bytes (IPv4) or 16 bytes (IPv6)
  uint64 pkt_count = 2;
  uint64 byte_count = 3;
  // Fields 4-8 DEPRECATED — kept for rollout backward compatibility.
  // Controller reads field 20 first; if empty, falls back to these.
  // Will be replaced with 'reserved 4,5,6,7,8' in a future cleanup release.
  uint32 tcp_count = 4      [deprecated = true];
  uint32 tcp_syn_count = 5  [deprecated = true];
  uint32 udp_count = 6      [deprecated = true];
  uint32 icmp_count = 7     [deprecated = true];
  uint32 frag_count = 8     [deprecated = true];
  uint32 small_pkt = 9;       // <128B
  uint32 medium_pkt = 10;     // 128-512B
  uint32 large_pkt = 11;      // >512B
  repeated uint32 decoder_counts = 20;      // indexed by shared/decoder constants
  repeated uint64 decoder_byte_counts = 21; // per-decoder byte counts for BPS thresholds
}

message PrefixStatsMsg {
  bytes  prefix = 1;           // network address (4 or 16 bytes)
  uint32 prefix_len = 2;
  uint64 pkt_count = 3;
  uint64 byte_count = 4;
  uint32 active_ips = 5;
  uint32 overflow_count = 6;
  // Fields 7-11 DEPRECATED — same rollout strategy as IPStats.
  uint32 tcp_count = 7      [deprecated = true];
  uint32 tcp_syn_count = 8  [deprecated = true];
  uint32 udp_count = 9      [deprecated = true];
  uint32 icmp_count = 10    [deprecated = true];
  uint32 frag_count = 11    [deprecated = true];
  repeated uint32 decoder_counts = 20;      // indexed by shared/decoder constants
  repeated uint64 decoder_byte_counts = 21; // per-decoder byte counts for BPS thresholds
}

message GlobalStatsMsg {
  uint64 total_pkts = 1;
  uint64 total_bytes = 2;
  uint64 matched_pkts = 3;
  uint64 matched_bytes = 4;                   // v2.11: bytes within watch scope (for global ip+bps)
  repeated uint32 decoder_counts = 20;        // v2.11: per-decoder PPS breakdown (matched only)
  repeated uint64 decoder_byte_counts = 21;   // v2.11: per-decoder BPS breakdown (matched only)
  // v2.11 Phase 2: outbound (src_ip matched) global counters
  uint64 src_matched_pkts = 30;
  uint64 src_matched_bytes = 31;
  repeated uint32 src_decoder_counts = 32;
  repeated uint64 src_decoder_byte_counts = 33;
}

message NodeHealth {
  string status = 1;           // "healthy" | "degraded" | "unhealthy"
  string message = 2;
}

message SamplingMetrics {
  float  ring_fill_ratio = 1;
  uint64 dropped_kernel = 2;
  uint64 dropped_user = 3;
  uint64 decode_error = 4;
  float  batch_send_latency_ms = 5;
  float  effective_sample_rate = 6;
}

// ---------------------------------------------------------------------------
// Channel 2: SampleStream (continuous small batches, best-effort)
// ---------------------------------------------------------------------------

message SampleBatch {
  string node_id = 1;
  string interface_name = 2;
  uint32 upstream_sample_rate = 3;
  uint32 local_sample_rate = 4;
  int64  timestamp = 5;
  repeated PacketSample samples = 6;
}

message PacketSample {
  bytes  raw_header = 1;
  bytes  src_ip = 2;
  bytes  dst_ip = 3;
  uint32 ip_protocol = 4;
  uint32 src_port = 5;
  uint32 dst_port = 6;
  uint32 packet_length = 7;
  uint32 tcp_flags = 8;
  uint32 ip_ttl = 9;
  uint32 fragment_offset = 10;
  uint32 icmp_type = 11;
  uint32 icmp_code = 12;
}

// ---------------------------------------------------------------------------
// Channel 3: CriticalEventStream (event-driven, lowest latency)
// ---------------------------------------------------------------------------

message CriticalEvent {
  string node_id = 1;
  string interface_name = 2;
  int64  timestamp = 3;
  bytes  dst_ip = 4;
  string event_type = 5;                 // e.g. "hard_threshold_exceeded"
  map<string, uint64> counters = 6;      // snapshot at trigger time

  // v4.0 inline scrubbing extensions (fields 20+; additive, backward compatible).
  // A Node emits these enriched events on the same stream when the local XDP
  // fast path detects a burst, a SYN-flood signature, or an L7 anomaly and
  // wants the Controller to escalate without waiting for the next 1s
  // StatsStream tick. Nodes running older firmware simply leave them unset.
  int64  timestamp_ns = 20;              // monotonic event time (unix nanos)
  bytes  target_ip = 21;                 // attacked destination (4 or 16 bytes); falls back to dst_ip
  string decoder = 22;                   // decoder family: tcp_syn, udp, dns_amplification, http_flood, ...
  uint64 current_pps = 23;               // per-destination packets/sec at trigger time
  uint64 current_bps = 24;               // per-destination bits/sec at trigger time
  string attack_type = 25;               // e.g. "syn_flood" (see controller decoderToAttackType)
  repeated FlowSample top_flows = 26;    // dominant flows at trigger time (narrow-then-rebreadth input)
  bool   local_mitigated = 27;           // true when the Node already applied an emergency micro-drop
}

// ---------------------------------------------------------------------------
// Channel 4: ControlStream (bidirectional)
// ---------------------------------------------------------------------------

message ControlMessage {
  oneof payload {
    ConfigPush config_push = 1;
    ConfigAck  config_ack = 2;
  }
}

message ConfigPush {
  WatchConfig watch_config = 1;
  uint64 delivery_version_current = 2;
}

message ConfigAck {
  uint64 delivery_version_applied = 1;
  bool   success = 2;
  string error_message = 3;
}

message WatchConfig {
  repeated WatchPrefix prefixes = 1;
  HardThresholds hard_thresholds = 2;
  // v3.0: flow mode config (ignored by xdp nodes, protobuf backward compatible)
  repeated FlowListenerConfig flow_listeners = 3;
  // v4.0: inline scrubbing packet filter tables (xdp_inline nodes).
  // nil = unchanged (node keeps its current rule set); empty rules = clear all.
  InlineRuleSet inline_rules = 4;
  // v4.0: node posture / hardware acceleration config. nil = unchanged.
  NodePostureConfig posture = 5;
}

// ---------------------------------------------------------------------------
// v4.0 Inline scrubbing — dynamic packet filter tables pushed over ControlStream
// ---------------------------------------------------------------------------

// InlineRuleSet is a full snapshot of the packet filters a Node must enforce
// in the XDP data plane. Delivery is idempotent: each push replaces the
// previous set entirely (rules are matched by id during reconciliation).
message InlineRuleSet {
  uint64 version = 1;               // monotonically increasing push version
  repeated InlineRule rules = 2;
  string default_action = 3;        // "pass" (default) | "drop" — action for traffic that matches no rule
  bool   syn_cookie_enabled = 4;    // kernel SYN-cookie engine master switch
  repeated string cookie_targets = 5; // CIDR prefixes protected by SYN cookies
}

// InlineRule is one surgical packet filter entry.
// Matching is longest-prefix on addresses, then exact on protocol/ports.
// A zero protocol or port matches any; a zero src address matches any source.
message InlineRule {
  uint64 id = 1;
  bytes  dst_ip = 2;               // 4 or 16 bytes; empty = any destination
  uint32 dst_prefix_len = 3;       // 0 = host match on dst_ip, or wildcard when dst_ip empty
  bytes  src_ip = 4;               // source subnet (clean-pipe / ACL rules)
  uint32 src_prefix_len = 5;
  uint32 protocol = 6;             // IANA number; 0 = any
  uint32 dst_port = 7;             // 0 = any
  uint32 src_port = 8;             // 0 = any
  string action = 9;               // "pass" | "drop" | "tx" | "redirect" | "syn_cookie" | "rate_limit" | "challenge"
  uint64 rate_limit_pps = 10;      // for action "rate_limit" (0 = unlimited)
  uint32 priority = 11;            // lower wins on overlapping exact keys
  int64  expires_unix = 12;        // 0 = until withdrawn
  uint64 attack_id = 13;           // owning attack (narrow-then-rebreadth bookkeeping)
  string reason = 14;              // audit label, e.g. "narrow:tcp/443"
  uint32 egress_ifindex = 15;      // for action "redirect"/"tx": clean-pipe egress interface
  string encap = 16;               // "" | "gre" | "geneve" — clean-pipe return tunnel encap
  string encap_daddr = 17;         // tunnel remote address for GRE/Geneve encap
}

// NodePostureConfig carries hardware-acceleration settings to inline nodes.
message NodePostureConfig {
  string xdp_mode = 1;             // "driver" (default) | "generic" | "offload"
  bool   af_xdp_enabled = 2;       // enable AF_XDP zero-copy L7 inspection sockets
  uint32 af_xdp_queue = 3;         // NIC RX queue steered into the XSK map
  bool   af_xdp_zero_copy = 4;     // request XDP_ZEROCOPY UMEM binding
  uint32 af_xdp_frames = 5;        // UMEM frame count (power of two, default 4096)
  repeated int64 cpu_pins = 6;     // pin parse/inspect goroutines to these cores (-1 = any)
}

// NodePosture is the Node's report of its data-plane health, included in every
// StatsReport so the Console can render the Hardware Posture panel.
message NodePosture {
  string xdp_mode = 1;             // "driver" | "generic" | "offload" | "flow" | "inline"
  bool   inline_enabled = 2;
  uint64 filter_rules = 3;         // active active_filter_rules entries
  uint64 validated_clients = 4;    // SYN-cookie validated client entries
  uint64 syn_cookies_reply = 5;    // SYN-ACKs emitted by the kernel engine
  uint64 syn_cookies_validated = 6;// client ACKs that validated
  uint64 syn_cookies_dropped = 7;  // ACKs that failed cookie validation
  uint64 emergency_drops = 8;      // micro-burst emergency drops
  uint64 burst_alerts = 9;         // ringbuf alerts pushed to userspace
  bool   af_xdp_active = 10;       // AF_XDP socket up
  uint64 af_xdp_umem_drops = 11;   // frames dropped for lack of UMEM buffers
  uint64 af_xdp_rx = 12;           // frames inspected via AF_XDP
  repeated int64 cpu_pins = 13;    // cores pinned by the node
  string cleanpipe_egress = 14;    // egress ifname used for clean-pipe redirect ("" = none)
}

// v3.0: Flow listener + source config pushed to Flow Nodes
message FlowListenerConfig {
  string listen_address = 1;                  // ":6343", ":2055"
  string protocol_mode = 2;                   // "auto" | "sflow" | "netflow" | "ipfix"
  repeated FlowSourceConfig sources = 3;
  bool   enabled = 4;
}

message FlowSourceConfig {
  string device_ip = 1;                       // exporter IP (matched against UDP src)
  string sample_mode = 2;                     // "auto" | "force" | "none"
  int32  sample_rate = 3;                     // force mode override value
  string name = 4;                            // display name
  bool   enabled = 5;
}

message WatchPrefix {
  bytes  prefix = 1;           // network address
  uint32 prefix_len = 2;
  string name = 3;             // human-readable label
}

message HardThresholds {
  uint64 pps = 1;              // per-IP packets/sec threshold
  uint64 bps = 2;              // per-IP bits/sec threshold
}
