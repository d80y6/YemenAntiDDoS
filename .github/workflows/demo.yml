name: Console demo
on:
  push:
    branches: [main]
    paths:
      - 'controller/console/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: controller/console/package-lock.json
      - name: Record build version
        working-directory: controller/console
        run: |
          echo "XSIGHT_VERSION=$(git describe --always)" >> "$GITHUB_ENV"
          node --version
          npm --version
      - run: npm ci
        working-directory: controller/console
      - run: npm run build
        working-directory: controller/console
      - run: npm run build:demo
        working-directory: controller/console
      - run: node demo/scan.mjs --prod dist --demo demo-dist
        working-directory: controller/console
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: controller/console/demo-dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
